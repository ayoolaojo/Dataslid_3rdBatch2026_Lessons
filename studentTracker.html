<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Tracker App</title>
    <link rel="stylesheet" href="./studentTacker.css" />
  </head>
  <body>
     <main class="app">

    <header class="app-header">
      <p class="eyebrow">STUDENT MANAGEMENT</p>
      <h1>Student Tracker</h1>
      <p class="subtitle">
        Keep track of student scores and quickly see who passed.
      </p>
    </header>

    <section class="summary">
      <p id="report"></p>
    </section>

    <section class="students-section">
      <div class="section-heading">
        <h2>Student Records</h2>
        <span>Double-click a student to delete</span>
      </div>

      <ul id="studentList"></ul>
    </section>

    <section class="add-section">
      <h2>Add New Student</h2>

      <div class="form">
        <input
          id="newStudentName"
          type="text"
          placeholder="Enter student's name"
        />

        <input
          id="newStudentScore"
          type="number"
          placeholder="Enter score (0-100)"
        />

        <button id="addStudentBtn">
          Add Student
        </button>

        <button id="passBtn" class="secondary-btn">
          Passed Students
        </button>
      </div>
    </section>

  </main>

    <script>
      //    Week 1 Project — Build a Student Score Tracker
      // This is a real mini-app. No tutorials, no copy-pasting. You build it yourself using everything from this week.

      // The scenario
      // You're building a simple student score tracker for a teacher. The teacher needs to see which students passed and which failed, and get a summary of the results.

      // What you must build
      // A single index.html file that does the following:
      // 1. Has this data hardcoded in JavaScript:
      // javascriptconst students = [
      //   { name: "Amina", score: 45 },
      //   { name: "Tunde", score: 82 },
      //   { name: "Chidi", score: 60 },
      //   { name: "Ngozi", score: 38 },
      //   { name: "Emeka", score: 91 }
      // ];
      // 2. On page load, displays:

      // A list of all students with their scores
      // Each student shown as: "Tunde — 82 points"
      // Students who scored 50 and above shown in green
      // Students who scored below 50 shown in red

      const defaultStudents = [
        { name: "Paul", score: 45 },
        { name: "Peter", score: 82 },
        { name: "Dave", score: 60 },
        { name: "Yusuff", score: 38 },
        { name: "Clinton", score: 91 },
        { name: "Qodri", score: 74 },
        { name: "Adams", score: 50 },
        { name: "Ayoola", score: 18 },
      ];

      const savedStudents = localStorage.getItem("students");
      const studentsArray = JSON.parse(savedStudents);

      let students;

      if (savedStudents) {
        students = JSON.parse(savedStudents);
      } else {
        students = defaultStudents;
      }

      const saveStudents = () => {
        localStorage.setItem("students", JSON.stringify(students));
      };

      const studentList = document.getElementById("studentList");
      const newStudentName = document.getElementById("newStudentName");
      const newStudentScore = document.getElementById("newStudentScore");
      const addStudentBtn = document.getElementById("addStudentBtn");
      const passBtn = document.getElementById("passBtn");
      const report = document.getElementById("report");

      const displayList = (array) => {
        studentList.innerHTML = "";
        array.forEach((x) => {
          const li = document.createElement("li");
          li.innerText = `${x.name} -  ${x.score}`;
          li.style.color = x.score >= 50 ? "green" : "red";
          li.style.fontSize = "0.6rem";
          studentList.append(li);

          li.addEventListener("dblclick", () => {
            const delButton = document.createElement("button");
            delButton.innerText = "Del";

            li.append(delButton);

            delButton.addEventListener('click', ()=>{
              students = students.filter((student)=>student.name !== x.name)
              saveStudents()
              displayList(students)
            })

            
          })
        });
      };

      displayList(students);

      let passed = students.filter((student) => student.score >= 50);
      console.log(passed);

      report.innerText = `${passed.length} students passed out of ${students.length}`;

      passBtn.addEventListener("click", () => {
        displayList(passed);
      });

      const addNewStudent = () => {
        const studentName = newStudentName.value;
        const studentScore = Number(newStudentScore.value);

        if (
          studentName.trim() === "" ||
          studentScore <= 0 ||
          studentScore > 100
        )
          return;

        const newStudent = {
          name: studentName,
          score: studentScore,
        };

        students.push(newStudent);
        saveStudents();

        passed = students.filter((student) => student.score >= 50);
        displayList(students);

        newStudentName.value = "";
        newStudentScore.value = "";

        report.innerText = `${passed.length} students passed out of ${students.length}`;
      };

      addStudentBtn.addEventListener("click", () => {
        addNewStudent();
        displayList(students);
      });
    </script>
  </body>
</html>
